[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mapi"
version = "0.1.0"
description = "FastAPI toolkit for parsing, validating, diffing, compressing, and indexing compact venue row progression maps."
authors = [{ name = "Dillon Barendt" }]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.12,<0.116.0",
    "pydantic-settings>=2.9.1,<3.0.0",
    "structlog>=25.3.0,<26.0.0",
    "uvicorn[standard]>=0.34.2,<0.35.0",
]

[project.optional-dependencies]
dev = [
    "black>=25.1.0,<26.0.0",
    "httpx>=0.28.1,<0.29.0",
    "hypothesis>=6.131.28,<7.0.0",
    "isort>=6.0.1,<7.0.0",
    "mypy>=1.16.0,<2.0.0",
    "pytest>=8.3.5,<9.0.0",
    "pytest-cov>=6.1.1,<7.0.0",
    "ruff>=0.11.13,<1.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN"]
ignore = ["ANN201", "ANN202", "ANN401"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
disallow_any_generics = false

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
