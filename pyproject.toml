[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mapi"
version = "0.1.0"
description = "FastAPI toolkit for parsing, validating, diffing, compressing, and indexing compact venue row progression maps."
authors = [{ name = "Dillon Barendt" }]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi[standard]>=0.115.12,<0.116.0",
  "pydantic-ai-slim>=2.6.0,<3.0.0",
  "pydantic-settings>=2.9.1,<3.0.0",
  "uvicorn[standard]>=0.34.2,<0.35.0",
]

[tool.uv]
package = true

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mapi*"]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN"]
ignore = ["ANN201", "ANN202", "ANN401"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
disallow_any_generics = false
mypy_path = "src"

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[dependency-groups]
dev = [
  "black>=25.1.0,<26.0.0",
  "commitlint>=1.13.3",
  "httpx>=0.28.1,<0.29.0",
  "hypothesis>=6.156.4",
  "isort>=6.0.1,<7.0.0",
  "jinja2>=3.1.6",
  "mypy>=2.2.0",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0,<8.0.0",
  "ruff>=0.15.21",
]
docs = [
  "mkdocs>=1.6.1",
  "mkdocs-material>=9.7.6",
  "mkdocs-mermaid2-plugin>=1.2.3",
  "mkdocs-minify-plugin>=0.8.0",
]
